<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wait & Win – Demo</title>

<style>
:root{
  --red:#DA291C;
  --yellow:#FFC72C;
  --dark:#27251F;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}

body{
  min-height:100vh;
  background:url("wait&win_BG.jpg") center/cover no-repeat fixed;
  display:flex;
  align-items:center;
  justify-content:center;
}

.mobile-container{
  width:390px;
  height:780px;
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.35);
  display:flex;
  flex-direction:column;
}

.header{
  background:var(--dark);
  color:#fff;
  padding:16px;
  text-align:center;
  border-bottom:4px solid var(--yellow);
}

.level{
  font-size:14px;
  color:var(--yellow);
  margin-top:4px;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:16px;
  padding:20px;
  text-align:center;
}

.btn{
  background:var(--red);
  color:#fff;
  border:none;
  border-radius:30px;
  padding:14px 30px;
  font-size:18px;
  cursor:pointer;
}

.toast{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#000;
  color:#fff;
  padding:10px 18px;
  border-radius:20px;
  display:none;
}

.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:20px;
}

.board.legend{
  grid-template-columns:repeat(4,1fr);
}

.cell{
  width:70px;
  height:70px;
  border:2px solid var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  cursor:pointer;
}

.timer{
  margin-top:12px;
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="mobile-container">
  <div class="header">
    <div>WAIT & WIN</div>
    <div class="level" id="levelText">Level: New Player</div>
  </div>

  <div class="main">
    <button class="btn" onclick="startGame()">Play</button>
    <div class="timer" id="timer"></div>
    <div class="board" id="board"></div>
  </div>
</div>

<script>
const levels=[
 {name:"New Player",score:0},
 {name:"Getting There",score:40},
 {name:"On Fire",score:100},
 {name:"Pro Mode",score:180},
 {name:"Legend Mode",score:260}
];

let score=0;
let currentLevel=0;
let time=10;
let fastRound=false;

function startGame(){
  setupBoard();
  startTimer();
}

function setupBoard(){
  const board=document.getElementById("board");
  board.innerHTML="";
  board.className="board";
  
  if(currentLevel===4){
    board.classList.add("legend");
    for(let i=0;i<16;i++) addCell(board);
  }else{
    for(let i=0;i<9;i++) addCell(board);
  }
}

function addCell(board){
  const c=document.createElement("div");
  c.className="cell";
  c.onclick=()=>endGame(true);
  board.appendChild(c);
}

function startTimer(){
  time=fastRound?5:10;
  document.getElementById("timer").innerText="Time: "+time;
  const t=setInterval(()=>{
    time--;
    document.getElementById("timer").innerText="Time: "+time;
    if(time<=0){
      clearInterval(t);
      endGame(false);
    }
  },1000);
}

function endGame(win){
  if(win) score+=20;
  else score+=5;
  checkLevel();
}

function checkLevel(){
  const next=levels[currentLevel+1];
  if(!next) return;
  
  if(score>=next.score){
    if(score<next.score+20 && currentLevel<3){
      fastRound=true;
      showToast("Final Round – win to level up");
    }else{
      currentLevel++;
      fastRound=false;
      updateLevel();
      showToast("Level Up: "+levels[currentLevel].name);
    }
  }
}

function updateLevel(){
  document.getElementById("levelText").innerText="Level: "+levels[currentLevel].name;
}

function showToast(txt){
  const t=document.getElementById("toast");
  t.innerText=txt;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}
</script>

</body>
</html>
