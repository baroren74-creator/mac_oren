<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Wait &amp; Win Demo</title>
  <style>
    /*
      Wait & Win demo game

      This file implements a self‑contained tic‑tac‑toe style game with
      progression mechanics.  Players earn points for wins and draws,
      advance through named levels, and face a short "Final Round" just
      before levelling up.  Upon reaching the final level the board
      automatically expands to 4×4 to increase the challenge.  All
      visuals live within a single HTML file aside from the background
      image, which is loaded from a sibling asset called
      ``wait&win_BG.jpg``.  To swap backgrounds simply replace that
      image file without touching this code.

      The game logic is intentionally simple: the AI difficulty ramps
      up from random moves through blocking/winning strategies, an
      optional minimax for the penultimate level, and finally a
      blocking heuristic again on the 4×4 board.  This demo is
      intended to showcase flow and progression rather than provide
      unbeatably perfect computer play.
    */

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      /* Load the branded background.  To change the look just replace
         wait&win_BG.jpg in the same folder.  No code modifications
         necessary. */
      background-image: url('wait&win_BG.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .game-container {
      max-width: 420px;
      margin: 30px auto;
      padding: 16px;
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    #levelLabel,
    #scoreLabel {
      font-weight: bold;
      font-size: 1.2em;
    }

    .timer-ring {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      /* The --progress custom property controls the fill angle of the
         conic gradient.  It is updated in JS as the timer counts
         down. */
      --progress: 360deg;
      background: conic-gradient(#ffcc00 var(--progress), #eee 0deg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
    }

    .timer-ring #timerLabel {
      position: absolute;
      font-size: 0.9em;
      font-weight: bold;
      color: #444;
    }

    .board {
      display: grid;
      gap: 4px;
      margin-top: 16px;
      /* Let the board size itself to its contents instead of stretching
         to the container.  Cells have explicit dimensions set in JS. */
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .cell {
      width: 80px;
      height: 80px;
      background-color: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      cursor: pointer;
      transition: background-color 0.2s;
      user-select: none;
    }

    .cell:hover {
      background-color: #f0f0f0;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      z-index: 1000;
      font-size: 0.9em;
      opacity: 0;
      animation: fadeInOut 3s forwards;
      pointer-events: none;
    }

    @keyframes fadeInOut {
      0%   { opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .message-banner {
      text-align: center;
      margin-top: 8px;
      font-weight: bold;
      color: #333;
      height: 24px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="scoreboard">
      <div id="levelLabel">Level: New Player</div>
      <div id="scoreLabel">Score: 0</div>
      <div class="timer-ring" id="timerRing" style="--progress: 360deg;">
        <div id="timerLabel">--</div>
      </div>
    </div>
    <div id="messageBanner" class="message-banner"></div>
    <div id="board" class="board"></div>
  </div>

  <script>
    // Game state variables
    let playerScore = 0;
    let currentLevelIndex = 0;
    let isGameOver = false;
    let isFastRound = false;
    let finalRoundTriggered = false;
    let countdownInterval = null;
    let timeRemaining = 20;

    // Player and AI marks
    const playerMark = 'X';
    const aiMark = 'O';

    // Level definitions with thresholds for demo pacing
    const levels = [
      { name: 'New Player', threshold: 0 },
      { name: 'Getting There', threshold: 40 },
      { name: 'On Fire', threshold: 100 },
      { name: 'Pro Mode', threshold: 180 },
      { name: 'Legend Mode', threshold: 260 }
    ];

    // Board variables
    let board = [];
    let boardSize = 3;

    // Initialise the game once the page is loaded
    window.addEventListener('load', () => {
      initGame();
    });

    /**
     * Initialise or reset the game.  Sets the board size based on the
     * current level, creates an empty board array, renders the UI and
     * resets the timer.  It also updates score and level labels.
     */
    function initGame() {
      isGameOver = false;
      // Determine board size: 3×3 for levels 0–3, 4×4 for Legend Mode
      boardSize = (currentLevelIndex < 4) ? 3 : 4;
      board = Array.from({ length: boardSize }, () => Array(boardSize).fill(''));
      renderBoard();
      resetTimer();
      updateScoreboard();
      document.getElementById('messageBanner').textContent = '';
    }

    /**
     * Render the current board to the DOM.  Creates a grid of divs and
     * attaches click listeners to each cell.
     * @param {void}
     */
    function renderBoard() {
      const boardDiv = document.getElementById('board');
      boardDiv.innerHTML = '';
      // Define fixed dimensions for each cell to ensure the board lays
      // out correctly regardless of container size.  Without fixed
      // dimensions the rows collapse to zero height when using 1fr.
      boardDiv.style.gridTemplateColumns = `repeat(${boardSize}, 80px)`;
      boardDiv.style.gridTemplateRows = `repeat(${boardSize}, 80px)`;
      board.forEach((row, i) => {
        row.forEach((cell, j) => {
          const cellDiv = document.createElement('div');
          cellDiv.className = 'cell';
          cellDiv.dataset.row = i;
          cellDiv.dataset.col = j;
          cellDiv.textContent = cell;
          cellDiv.addEventListener('click', handlePlayerMove);
          boardDiv.appendChild(cellDiv);
        });
      });
    }

    /**
     * Handle a player's move on click.  Places the player's mark, checks
     * for a win or draw, and if the game continues invokes the AI move.
     * @param {MouseEvent} e
     */
    function handlePlayerMove(e) {
      if (isGameOver) return;
      const row = parseInt(e.target.dataset.row);
      const col = parseInt(e.target.dataset.col);
      if (board[row][col] !== '') return; // Already occupied
      board[row][col] = playerMark;
      e.target.textContent = playerMark;
      if (checkWin(playerMark)) {
        endGame('player');
        return;
      }
      if (isBoardFull()) {
        endGame('draw');
        return;
      }
      aiMove();
    }

    /**
     * Perform the AI's move based on the current level.  Chooses a move
     * using increasingly sophisticated heuristics or minimax.
     */
    function aiMove() {
      if (isGameOver) return;
      let move;
      if (currentLevelIndex === 0) {
        // New Player: purely random
        move = randomMove(board);
      } else if (currentLevelIndex === 1) {
        // Getting There: attempt to win or block, otherwise random
        move = winningOrBlockingMove(board, aiMark, playerMark) || randomMove(board);
      } else if (currentLevelIndex === 2) {
        // On Fire: win/block, then prefer centre/corners, else random
        move = winningOrBlockingMove(board, aiMark, playerMark) || strategicMove(board) || randomMove(board);
      } else if (currentLevelIndex === 3 && boardSize === 3) {
        // Pro Mode (3×3 only): full minimax search
        move = minimaxRoot(board, aiMark, playerMark);
      } else {
        // Legend Mode or fallback: simple win/block again
        move = winningOrBlockingMove(board, aiMark, playerMark) || randomMove(board);
      }
      if (move) {
        board[move[0]][move[1]] = aiMark;
        updateBoardCell(move[0], move[1], aiMark);
        if (checkWin(aiMark)) {
          endGame('ai');
          return;
        }
        if (isBoardFull()) {
          endGame('draw');
          return;
        }
      }
    }

    /**
     * Update the visual representation of a single cell.  Used after the
     * AI places a move programmatically.
     * @param {number} row
     * @param {number} col
     * @param {string} mark
     */
    function updateBoardCell(row, col, mark) {
      const cellDiv = document.querySelector(`.cell[data-row='${row}'][data-col='${col}']`);
      if (cellDiv) {
        cellDiv.textContent = mark;
      }
    }

    /**
     * Conclude the current game.  Updates scores, shows messages and
     * schedules a new game.  Handles special logic for fast rounds
     * (Final Round) and levelling up.
     * @param {string} winner - 'player', 'ai' or 'draw'
     */
    function endGame(winner) {
      isGameOver = true;
      stopTimer();
      let message;
      if (winner === 'player') {
        message = 'You won! +20 points';
        playerScore += 20;
        if (isFastRound) {
          // Winning a fast round immediately levels up
          levelUp();
          endFastRound();
        } else {
          checkForFastRound();
        }
      } else if (winner === 'ai') {
        message = 'You lost! +5 points';
        playerScore += 5;
        // Losing resets any fast round flags
        if (isFastRound) {
          endFastRound();
        } else {
          checkForFastRound();
        }
      } else {
        message = 'Draw! +5 points';
        playerScore += 5;
        if (isFastRound) {
          endFastRound();
        } else {
          checkForFastRound();
        }
      }
      showToast(message);
      updateScoreboard();
      // Start a new game after a brief pause
      setTimeout(initGame, 1000);
    }

    /**
     * Determine if all cells on the board have been filled.
     * @returns {boolean}
     */
    function isBoardFull() {
      return board.every(row => row.every(cell => cell !== ''));
    }

    /**
     * Check whether a given mark has achieved a win.  Considers rows,
     * columns and both diagonals.  Works for variable board sizes.
     * @param {string} mark
     * @returns {boolean}
     */
    function checkWin(mark) {
      const n = boardSize;
      // Check rows and columns
      for (let i = 0; i < n; i++) {
        if (board[i].every(cell => cell === mark)) return true;
        let colWin = true;
        for (let j = 0; j < n; j++) {
          if (board[j][i] !== mark) {
            colWin = false;
            break;
          }
        }
        if (colWin) return true;
      }
      // Diagonal top-left to bottom-right
      let diag1Win = true;
      let diag2Win = true;
      for (let i = 0; i < n; i++) {
        if (board[i][i] !== mark) diag1Win = false;
        if (board[i][n - 1 - i] !== mark) diag2Win = false;
      }
      return diag1Win || diag2Win;
    }

    /**
     * Return a random empty cell from the board.  Used by simple AI.
     * @param {string[][]} brd
     * @returns {number[]|null}
     */
    function randomMove(brd) {
      const empty = [];
      for (let i = 0; i < brd.length; i++) {
        for (let j = 0; j < brd[i].length; j++) {
          if (brd[i][j] === '') empty.push([i, j]);
        }
      }
      if (empty.length === 0) return null;
      return empty[Math.floor(Math.random() * empty.length)];
    }

    /**
     * Look for a winning move for the AI or a blocking move against the
     * player.  Evaluates each empty cell by temporarily placing a mark
     * and checking for a win.
     * @param {string[][]} brd
     * @param {string} ai
     * @param {string} player
     * @returns {number[]|null}
     */
    function winningOrBlockingMove(brd, ai, player) {
      const empty = [];
      for (let i = 0; i < brd.length; i++) {
        for (let j = 0; j < brd[i].length; j++) {
          if (brd[i][j] === '') empty.push([i, j]);
        }
      }
      // Try to win
      for (const [i, j] of empty) {
        brd[i][j] = ai;
        const win = checkWin(ai);
        brd[i][j] = '';
        if (win) return [i, j];
      }
      // Try to block
      for (const [i, j] of empty) {
        brd[i][j] = player;
        const win = checkWin(player);
        brd[i][j] = '';
        if (win) return [i, j];
      }
      return null;
    }

    /**
     * Choose a strategic move: centre if available (for odd boards), then
     * random corner.  Used on intermediate difficulty levels.
     * @param {string[][]} brd
     * @returns {number[]|null}
     */
    function strategicMove(brd) {
      const n = brd.length;
      // Centre on odd boards
      if (n % 2 === 1) {
        const mid = Math.floor(n / 2);
        if (brd[mid][mid] === '') return [mid, mid];
      }
      // Choose from available corners
      const corners = [[0, 0], [0, n - 1], [n - 1, 0], [n - 1, n - 1]];
      const availCorners = corners.filter(([i, j]) => brd[i][j] === '');
      if (availCorners.length > 0) {
        return availCorners[Math.floor(Math.random() * availCorners.length)];
      }
      return null;
    }

    /**
     * Determine the best move using a minimax search.  Only invoked on
     * 3×3 boards for the "Pro Mode" level to avoid excessive
     * computation.  Returns the position of the optimal move.
     * @param {string[][]} brd
     * @param {string} ai
     * @param {string} player
     * @returns {number[]|null}
     */
    function minimaxRoot(brd, ai, player) {
      let bestVal = -Infinity;
      let bestMove = null;
      for (let i = 0; i < brd.length; i++) {
        for (let j = 0; j < brd[i].length; j++) {
          if (brd[i][j] === '') {
            brd[i][j] = ai;
            const moveVal = minimax(brd, 0, false, ai, player);
            brd[i][j] = '';
            if (moveVal > bestVal) {
              bestVal = moveVal;
              bestMove = [i, j];
            }
          }
        }
      }
      return bestMove;
    }

    /**
     * Recursive minimax function.  Explores possible game states to
     * determine the best score for the AI.  Returns a value:
     * positive if the position is good for AI, negative if good for the
     * player.  Depth is used to prioritise faster wins or slower
     * losses.
     * @param {string[][]} brd
     * @param {number} depth
     * @param {boolean} isMax
     * @param {string} ai
     * @param {string} player
     * @returns {number}
     */
    function minimax(brd, depth, isMax, ai, player) {
      if (checkWin(ai)) return 10 - depth;
      if (checkWin(player)) return depth - 10;
      if (isBoardFull()) return 0;
      if (isMax) {
        let best = -Infinity;
        for (let i = 0; i < brd.length; i++) {
          for (let j = 0; j < brd[i].length; j++) {
            if (brd[i][j] === '') {
              brd[i][j] = ai;
              best = Math.max(best, minimax(brd, depth + 1, false, ai, player));
              brd[i][j] = '';
            }
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < brd.length; i++) {
          for (let j = 0; j < brd[i].length; j++) {
            if (brd[i][j] === '') {
              brd[i][j] = player;
              best = Math.min(best, minimax(brd, depth + 1, true, ai, player));
              brd[i][j] = '';
            }
          }
        }
        return best;
      }
    }

    /**
     * Update the scoreboard labels for score and level.
     */
    function updateScoreboard() {
      document.getElementById('scoreLabel').textContent = 'Score: ' + playerScore;
      document.getElementById('levelLabel').textContent = 'Level: ' + levels[currentLevelIndex].name;
    }

    /**
     * Perform a level up.  Increments the current level index (unless
     * already at the highest level), resets fast round flags and
     * displays an informative message.  Also informs the user if the
     * board will be upgraded in the next game.
     */
    function levelUp() {
      if (currentLevelIndex < levels.length - 1) {
        currentLevelIndex++;
      }
      updateScoreboard();
      showToast('Level Up! ' + levels[currentLevelIndex].name + ' unlocked');
      // Notify about board upgrade if entering Legend Mode
      if (currentLevelIndex === levels.length - 1) {
        const newBoardSize = (currentLevelIndex < 4) ? 3 : 4;
        showToast('Legend Mode unlocked! Board upgraded to ' + newBoardSize + '×' + newBoardSize);
      }
    }

    /**
     * Display a transient toast message.  Toasts fade in and out
     * automatically and then remove themselves from the DOM.
     * @param {string} msg
     */
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    /**
     * Reset and start the timer.  Uses a conic gradient on the timer
     * ring to visually represent remaining time and numeric countdown in
     * the centre.  If the timer reaches zero before the game ends, the
     * round is treated as a loss.  Fast rounds use a shorter limit.
     */
    function resetTimer() {
      stopTimer();
      timeRemaining = isFastRound ? 6 : 20;
      updateTimerUI();
      countdownInterval = setInterval(() => {
        timeRemaining -= 1;
        if (timeRemaining <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          if (!isGameOver) {
            // Time expired counts as a loss
            endGame('ai');
          }
        } else {
          updateTimerUI();
        }
      }, 1000);
    }

    /**
     * Stop the timer interval if it is running.
     */
    function stopTimer() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }

    /**
     * Update the timer ring and label based on the remaining time and
     * whether it is a fast or regular round.
     */
    function updateTimerUI() {
      const ring = document.getElementById('timerRing');
      const label = document.getElementById('timerLabel');
      const total = isFastRound ? 6 : 20;
      const angle = (timeRemaining / total) * 360;
      ring.style.setProperty('--progress', angle + 'deg');
      label.textContent = timeRemaining;
    }

    /**
     * Trigger a fast round if the player is within one win of the next
     * level and a fast round hasn't already been triggered.  Fast
     * rounds shorten the timer and require a win to level up.
     */
    function checkForFastRound() {
      // Only trigger once per level and never in Legend Mode
      if (finalRoundTriggered || currentLevelIndex >= levels.length - 1) return;
      const nextThreshold = levels[currentLevelIndex + 1].threshold;
      if (playerScore >= nextThreshold - 20) {
        finalRoundTriggered = true;
        isFastRound = true;
        showToast('Final Round! Win to level up');
      }
    }

    /**
     * Reset fast round flags after it finishes (win or loss).  Called
     * automatically from endGame().  Does not level down or penalise
     * points beyond the standard loss/draw behaviour.
     */
    function endFastRound() {
      isFastRound = false;
      finalRoundTriggered = false;
    }

    // Periodically update the message banner to reflect fast round state
    setInterval(() => {
      const banner = document.getElementById('messageBanner');
      if (isFastRound) {
        banner.textContent = 'Fast Round! Hurry up';
      } else {
        banner.textContent = '';
      }
    }, 300);
  </script>
</body>
</html>
